name: ROS package integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  noetic:
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - uses: actions/checkout@v4
      - name: Install package dependencies
        run: |
          apt-get update
          apt-get install -y python3-opencv python3-numpy ros-noetic-cv-bridge ros-noetic-rostest
      - name: Build and test ROS transport
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          mkdir -p /tmp/lane_ws/src
          cp -r packages/duckie_lane_following /tmp/lane_ws/src/
          cd /tmp/lane_ws
          catkin_make
          source devel/setup.bash
          catkin_make run_tests
          catkin_test_results build/test_results

